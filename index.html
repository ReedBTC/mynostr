<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src * blob: data:; media-src *; connect-src *; font-src 'self'; frame-src *;" />
    <!-- Icon ladder. Largest sizes first so Google + browsers pick the
         best fit for their context. The 192/512 PNGs are designed
         edge-to-edge so Google's circular favicon frame in search
         results doesn't ring the brand with whitespace; the maskable
         512 variant has the brand inside the centered safe zone for
         Android adaptive icons (Pixel circle, Samsung squircle, etc).
         apple-touch-icon at 180 covers iOS home-screen + Safari pinned
         tabs; the legacy 96 favicon is kept as the small-tab fallback. -->
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="96x96"   href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- iOS standalone-mode hooks. Without these, an iPhone user who
         taps Share → "Add to Home Screen" gets a tile that opens
         MyNostr in regular Safari with the URL bar + nav buttons
         visible. With them, the home-screen tile launches into a
         standalone-app frame (no browser chrome), the status bar
         reads dark over the app's near-black background, and the
         tile label reads "MyNostr" rather than the document title. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MyNostr" />
    <link rel="canonical" href="https://mynostr.app/" />
    <!-- Title + description tuned for SERP relevance. Title hits brand
         + category + two highest-volume modules in ~55 chars (fits SERP
         without truncation). Description packs the remaining module
         keywords inside Google's ~155-char visible window. -->
    <title>MyNostr — Personal Nostr portal: notes, articles, events</title>
    <meta name="description" content="MyNostr is a personal Nostr portal — publish notes and longform articles, host events, sell on the marketplace, manage relays, and organize bookmarks." />
    <!--
      Open Graph + Twitter defaults for the homepage and any unmatched
      route (e.g., /login, /help, deep links to undeployed routes). The
      Pages Function strips and replaces these on shareable entity URLs
      (articles, notes, profiles), so they don't conflict with per-entity
      meta — they're the static fallback for everything else.
    -->
    <meta property="og:title" content="MyNostr — Personal Nostr portal: notes, articles, events" />
    <meta property="og:description" content="MyNostr is a personal Nostr portal — publish notes and longform articles, host events, sell on the marketplace, manage relays, and organize bookmarks." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mynostr.app" />
    <meta property="og:site_name" content="MyNostr" />
    <meta property="og:image" content="https://mynostr.app/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MyNostr — Personal Nostr portal: notes, articles, events" />
    <meta name="twitter:description" content="MyNostr is a personal Nostr portal — publish notes and longform articles, host events, sell on the marketplace, manage relays, and organize bookmarks." />
    <meta name="twitter:image" content="https://mynostr.app/og-default.jpg" />
    <!--
      WebSite + Organization JSON-LD for the homepage. Tells Google the
      site's canonical name (so search-result listings show "MyNostr"
      with proper formatting instead of just the bare URL) and links the
      site to a publishing entity. The worker strips JSON-LD on entity
      URLs (articles/profiles/events) and replaces with per-entity
      schema, so this only takes effect on the homepage and other
      non-entity routes.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://mynostr.app/#website",
          "url": "https://mynostr.app",
          "name": "MyNostr",
          "alternateName": "mynostr.app",
          "description": "MyNostr is a personal Nostr portal — publish notes and longform articles, host events, sell on the marketplace, manage relays, and organize bookmarks.",
          "publisher": { "@id": "https://mynostr.app/#org" },
          "inLanguage": "en-US"
        },
        {
          "@type": "Organization",
          "@id": "https://mynostr.app/#org",
          "name": "MyNostr",
          "url": "https://mynostr.app"
        },
        {
          "@type": "SoftwareApplication",
          "@id": "https://mynostr.app/#app",
          "name": "MyNostr",
          "url": "https://mynostr.app",
          "description": "Personal Nostr client and portal: notes, longform articles, calendar events, NIP-99 marketplace, relay management, and bookmarks. Sign in with any Nostr key.",
          "applicationCategory": "SocialNetworkingApplication",
          "operatingSystem": "Any",
          "publisher": { "@id": "https://mynostr.app/#org" },
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          }
        },
        {
          "@type": "FAQPage",
          "@id": "https://mynostr.app/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What is MyNostr?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "MyNostr is a personal Nostr client and portal where you can publish notes, write longform articles, host events, list items in a NIP-99 marketplace, and manage your relays — all signed with your Nostr key. It's a single dashboard for everything you do on Nostr."
              }
            },
            {
              "@type": "Question",
              "name": "Do I need an account to use MyNostr?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No account creation is needed. Nostr identities are public/private keypairs that work across every Nostr app. You can sign in with a browser extension (Alby, nos2x, etc.), a remote signer like Amber, or a bunker connection string. If you don't have a Nostr key yet, generate one with a tool like nstart.me or nsec.app first, then sign in here. You can also browse other users' public pages without signing in at all."
              }
            },
            {
              "@type": "Question",
              "name": "Is MyNostr free?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. MyNostr is free to use, with no subscription, no advertising, and no data harvesting. Your content publishes directly to public Nostr relays."
              }
            },
            {
              "@type": "Question",
              "name": "Where is my data stored?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Your published events live on the Nostr relays you choose to publish to (declared in your kind 10002 relay list). MyNostr does not store any of your events on its own servers — every read and write goes directly between your client and the relays."
              }
            },
            {
              "@type": "Question",
              "name": "What is a Nostr key?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "A Nostr key is a cryptographic keypair — a public key (npub) that represents your identity and a private key (nsec) that signs your events. The same key works on every Nostr app, so there is no separate MyNostr account, login, or password to remember."
              }
            },
            {
              "@type": "Question",
              "name": "Can I share my MyNostr profile with someone who doesn't use Nostr?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Every page on MyNostr has a shareable link (mynostr.app/<npub> for your profile, mynostr.app/<naddr> for an article, and so on). When you paste these links in iMessage, Telegram, Discord, or X, they unfurl with rich previews. Recipients can browse without an account."
              }
            },
            {
              "@type": "Question",
              "name": "Does MyNostr handle checkout for marketplace listings?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. MyNostr lets you publish and manage NIP-99 / Gamma marketplace listings, but actual checkout happens in dedicated marketplace apps like Shopstr or Plebeian Market. Your listings are published in a fully spec-compliant shape — structured shipping options (kind 30406), payment preference on your kind 0 profile, and an optional NIP-89 app recommendation — so any Gamma-aware marketplace app can quote shipping, accept payment, and route buyers through their checkout flow against your listings. The Compliance Check tool in My Selling shows which of your listings are checkout-ready and migrates the rest in one click."
              }
            }
          ]
        }
      ]
    }
    </script>
  </head>
  <body class="bg-neutral-950">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
