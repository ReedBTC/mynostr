<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src * blob: data:; media-src *; connect-src *; font-src 'self'; frame-src *;" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- iOS / Android home-screen icon. Re-uses /favicon.png until a
         proper 180×180 apple-touch-icon.png is added; iOS scales the
         existing favicon down acceptably for the home-screen tile. -->
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="canonical" href="https://mynostr.app/" />
    <!-- Title + description tuned for SERP relevance. Title hits brand
         + category + two highest-volume modules in ~55 chars (fits SERP
         without truncation). Description packs the remaining module
         keywords inside Google's ~155-char visible window. -->
    <title>MyNostr — Personal Nostr portal: notes, articles, events</title>
    <meta name="description" content="MyNostr is a personal Nostr portal — publish notes and longform articles, host events, sell on the marketplace, manage relays, and organize bookmarks." />
    <!--
      Open Graph + Twitter defaults for the homepage and any unmatched
      route (e.g., /login, /help, deep links to undeployed routes). The
      Pages Function strips and replaces these on shareable entity URLs
      (articles, notes, profiles), so they don't conflict with per-entity
      meta — they're the static fallback for everything else.
    -->
    <meta property="og:title" content="MyNostr — Personal Nostr portal: notes, articles, events" />
    <meta property="og:description" content="MyNostr is a personal Nostr portal — publish notes and longform articles, host events, sell on the marketplace, manage relays, and organize bookmarks." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mynostr.app" />
    <meta property="og:site_name" content="MyNostr" />
    <meta property="og:image" content="https://mynostr.app/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MyNostr — Personal Nostr portal: notes, articles, events" />
    <meta name="twitter:description" content="MyNostr is a personal Nostr portal — publish notes and longform articles, host events, sell on the marketplace, manage relays, and organize bookmarks." />
    <meta name="twitter:image" content="https://mynostr.app/og-default.jpg" />
    <!--
      WebSite + Organization JSON-LD for the homepage. Tells Google the
      site's canonical name (so search-result listings show "MyNostr"
      with proper formatting instead of just the bare URL) and links the
      site to a publishing entity. The worker strips JSON-LD on entity
      URLs (articles/profiles/events) and replaces with per-entity
      schema, so this only takes effect on the homepage and other
      non-entity routes.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://mynostr.app/#website",
          "url": "https://mynostr.app",
          "name": "MyNostr",
          "alternateName": "mynostr.app",
          "description": "MyNostr is a personal Nostr portal — publish notes and longform articles, host events, sell on the marketplace, manage relays, and organize bookmarks.",
          "publisher": { "@id": "https://mynostr.app/#org" },
          "inLanguage": "en-US"
        },
        {
          "@type": "Organization",
          "@id": "https://mynostr.app/#org",
          "name": "MyNostr",
          "url": "https://mynostr.app"
        },
        {
          "@type": "SoftwareApplication",
          "@id": "https://mynostr.app/#app",
          "name": "MyNostr",
          "url": "https://mynostr.app",
          "description": "Personal Nostr client and portal: notes, longform articles, calendar events, NIP-99 marketplace, relay management, and bookmarks. Sign in with any Nostr key.",
          "applicationCategory": "SocialNetworkingApplication",
          "operatingSystem": "Any",
          "publisher": { "@id": "https://mynostr.app/#org" },
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          }
        }
      ]
    }
    </script>
  </head>
  <body class="bg-neutral-950">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
